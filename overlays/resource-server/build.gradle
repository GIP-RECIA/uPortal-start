/*
 * NOTE:  This bundled app is a more recent copy of the ResourceServingWebapp.
 *
 * For releases beginning with 1.1.0, the resource-server-content module removed some older versions
 * of several libraries.  uPortal, however, still depends on some of those libraries, and currently
 * won't work without a copy of ResourceServingWebapp.  For webjar support, on the other hand, we
 * need version 1.3.x.  So (for now) we will run two copies.
 */
buildscript {
    repositories {
        jcenter()
    }
    dependencies {
        classpath "org.scaldingspoon.gradle:gradle-waroverlay-plugin:${waroverlayPluginVersion}"
        classpath "org.jasig.resourceserver:resource-server-core:${resourceServerWebjarVersion}"
    }
}

repositories {
    mavenCentral artifactUrls: ["http://developer.jasig.org/repo/content/groups/m2-legacy/", "http://central.maven.org/maven2/"]
}


configurations {
    // Create new dependency configuration
    // for dependencies to be added in
    // WAR file.
    warLib.extendsFrom runtime
}

dependencies {
    runtime "org.jasig.resourceserver:resource-server-webapp:${resourceServerWebjarVersion}@war"

    // TODO : get versions from env
    compileOnly("org.springframework.boot:spring-boot:2.0.4.RELEASE@jar")
    compileOnly("org.springframework.boot:spring-boot-starter-web:2.0.4.RELEASE@jar")
    compileOnly("org.springframework:spring-core:5.0.8.RELEASE@jar")
    compileOnly("org.springframework:spring-context:5.0.8.RELEASE@jar")
    compileOnly("org.springframework:spring-web:5.0.8.RELEASE@jar")
    compileOnly("org.springframework:spring-beans:5.0.8.RELEASE@jar")
    compileOnly("javax.servlet:javax.servlet-api:4.0.1@jar")
    compileOnly("org.slf4j:slf4j-api:1.7.25@jar")

    runtime "org.webjars.npm:vue:${vueVersion}@jar"

    // uPortal Web Components Webjars
    runtime "org.webjars.npm:uportal__api-template-vue:${uPortalWebComponentsVersion}@jar"
    runtime "org.webjars.npm:uportal__content-carousel:${uPortalWebComponentsVersion}@jar"
    runtime "org.webjars.npm:uportal__esco-content-menu:${uPortalWebComponentsVersion}@jar"
    runtime "org.webjars.npm:uportal__waffle-menu:${uPortalWebComponentsVersion}@jar"

    // Notification Webjars
    runtime "org.webjars.npm:uportal__notification-banner:${notificationWebComponentsVersion}@jar"
    runtime "org.webjars.npm:uportal__notification-icon:${notificationWebComponentsVersion}@jar"
    runtime "org.webjars.npm:uportal__notification-list:${notificationWebComponentsVersion}@jar"
    runtime "org.webjars.npm:uportal__notification-modal:${notificationWebComponentsVersion}@jar"

    // Third party Webjars
    runtime "org.webjars.npm:html-include-element:${htmlIncludeElementWebComponentVersion}@jar"

    // GIP RECIA Webjars
    runtime "org.webjars.npm:gip-recia__extended-uportal-header:${extendedUportalHeaderWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__esco-content-menu-lit:${escoContentMenuLitWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__eyebrow-user-info-lit:${eyebrowUserInfoLitWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__menu-cantine:${menuCantineWebComponentVersion}@jar"
    runtime "org.webjars.npm:gip-recia__param-etab:${paramEtabWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__actualites:${actualitesWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__ui-webcomponents:${uiWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__mediacentre-ui:${mediacentreUiWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__ui-ressources-gar:${uiRessourcesGarWebComponentsVersion}@jar"
    runtime "org.webjars.npm:gip-recia__widgets-to-endpoints-adapter:${widgetsToEndpointsAdapterVersion}@jar"
    runtime "org.webjars.npm:gip-recia__didacticiel-ent:${didacticielEntVersion}@jar"
}

war {
    archiveName 'resource-server.war'
    // Add warLib dependency configuration
    classpath this.configurations.warLib

    // We remove all duplicate files
    // with this assignment.
    // geFiles() method return a unique
    // set of File objects, removing
    // any duplicates from configurations
    // added by classpath() method.
    classpath = classpath.files
    /*
     * For uPortal 5 (and beyond), the Community Best Practice for WAR files published to Maven
     * Central is that they should *not* contain JDBC driver jars;  all such WAR files are
     * implemented locally by "overlaying" them, and it is the responsibility of they overlaying
     * project (here uPortal-start) to provide them with the appropriate drivers.  When the
     * published artifacts already contain drivers, the danger of conflicting versions is very
     * high.
     *
     * Nevertheless, earlier versions of uPortal and Apereo portlets *do* contain JDBC drivers,
     * specifically HSQLDB.  The following exclusion prevents the copy of this driver contained
     * within the published WAR file from being deployed.  Please remove this line when the
     * published artifact reliably omits the HSQLDB driver.
     *
     * See https://github.com/Jasig/uPortal-start/pull/120
     */
}
